[project]
name = "ats-jobs-mcp"
version = "1.2.0"
description = "MCP server for company data read from official sources: newly formed US businesses (NY, CO, OR, CT, PA) with proven websites, company registers, tech stack, SEC financials, and open jobs from Greenhouse, Ashby, Lever and Workable."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "mcp", "model-context-protocol", "jobs", "job-board", "job-postings",
    "greenhouse", "ashby", "lever", "workable", "ats",
    "applicant-tracking-system", "careers", "hiring", "recruiting",
    "company-data", "new-businesses", "kyb", "business-registry", "lead-generation",
    "tech-stack", "sec", "x402",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=1.0",
    "certifi>=2024.1.1",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://companyfacts.dev"
Source = "https://github.com/groundtruthtools/ats-jobs-mcp"
Documentation = "https://companyfacts.dev/llms.txt"
"Remote MCP" = "https://companyfacts.dev/mcp"

[project.scripts]
ats-jobs-mcp = "ats_jobs_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ats_jobs_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/ats_jobs_mcp/directory.json" = "ats_jobs_mcp/directory.json"
